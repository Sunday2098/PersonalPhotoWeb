<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>夏至未至 · 后台管理(仅本机)</title>
<style>
  :root {
    --bg: #ffffff; --ink: #1a1a1a; --mist: #8a8a8a; --terra: #c4a882;
    --line: #e8e8e6; --sel: rgba(196, 168, 130, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 15px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--bg); }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
  header .hint { font-size: 12px; color: var(--mist); }
  .btn { padding: 8px 16px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-size: 13px; cursor: pointer; border-radius: 4px; transition: all .2s; }
  .btn:hover { background: var(--ink); color: #fff; }
  .btn.ghost { border-color: var(--line); color: var(--mist); }
  .btn.ghost:hover { background: var(--line); color: var(--ink); }
  .btn.primary { background: var(--terra); border-color: var(--terra); color: #fff; }
  .btn.primary:hover { background: #b39572; }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 57px); }
  /* 左侧项目列表 */
  aside { border-right: 1px solid var(--line); padding: 18px 16px; max-height: calc(100vh - 57px); display: flex; flex-direction: column; }
  /* 项目列表自己滚动,底部「新建项目」按钮始终可见 */
  .proj-scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .aside-foot { flex: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .aside-foot .btn { width: 100%; }
  aside h2 { font-size: 13px; color: var(--mist); font-weight: 500; margin-bottom: 10px; letter-spacing: 1px; }
  .proj { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 6px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; transition: all .15s; }
  .proj:hover { background: #f5f5f3; }
  .proj.active { background: var(--sel); border-color: var(--terra); }
  .proj.dragover { background: var(--sel); border-color: var(--terra); box-shadow: 0 0 0 2px var(--sel); }
  .proj .name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj .count { font-size: 12px; color: var(--mist); background: #f0f0ee; border-radius: 10px; padding: 0 8px; }
  /* 右侧照片网格 */
  main { padding: 18px 20px; overflow-y: auto; max-height: calc(100vh - 57px); }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar h2 { font-size: 16px; font-weight: 600; }
  .toolbar .info { font-size: 12px; color: var(--mist); }
  .toolbar .search { margin-left: auto; width: 200px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; outline: none; }
  .toolbar .search:focus { border-color: var(--terra); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { padding: 6px 12px; border: none; background: #fff; color: var(--mist); font-size: 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: #fff; }
  .selbar { display: none; align-items: center; gap: 12px; margin-bottom: 16px; padding: 10px 14px; background: var(--sel); border: 1px solid var(--terra); border-radius: 6px; font-size: 13px; }
  .selbar.show { display: flex; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .ph { position: relative; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; background: #f0f0ee; }
  .ph img { display: block; width: 100%; aspect-ratio: 3/2; object-fit: cover; pointer-events: none; }
  .ph .tag { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px; font-size: 11px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.7)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph.sel { border-color: var(--terra); box-shadow: 0 0 0 2px var(--sel); }
  .ph.dragging { opacity: .4; }
  .acts { position: absolute; top: 4px; right: 4px; display: flex; flex-direction: column; gap: 4px; opacity: 0; transition: opacity .15s; }
  .ph:hover .acts { opacity: 1; }
  .act { width: 22px; height: 22px; border: none; border-radius: 4px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 1; cursor: pointer; }
  .act:hover { background: rgba(0,0,0,.85); }
  .act.del:hover { background: #b0392e; }
  .badge { padding: 1px 6px; border-radius: 3px; background: var(--terra); color: #fff; font-size: 11px; pointer-events: none; }
  .proj { position: relative; }
  .proj .del { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border: none; border-radius: 4px; background: rgba(0,0,0,.4); color: #fff; font-size: 11px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .proj:hover .del { opacity: 1; }
  .proj .del:hover { background: #b0392e; }
  .danger { background: #b0392e !important; border-color: #b0392e !important; color: #fff !important; }
  .danger:hover { background: #8f2d24 !important; }
  #push-log { background: #f7f7f5; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; max-height: 260px; overflow-y: auto; margin-bottom: 12px; min-height: 60px; }
  .empty { padding: 60px 0; text-align: center; color: var(--mist); font-size: 13px; }
  /* 头部 Git 状态胶囊 */
  .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: #f7f7f5; color: var(--mist); font-size: 12px; cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: var(--terra); color: var(--ink); }
  .chip.dirty { background: var(--sel); border-color: var(--terra); color: var(--ink); }
  .chip b { color: #b0392e; }
  /* 回收站 */
  .trash-row { display: flex; align-items: center; gap: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; background: #fff; }
  .trash-row img { width: 72px; height: 48px; object-fit: cover; border-radius: 4px; background: #f0f0ee; flex: none; }
  .trash-row .meta { flex: 1; min-width: 0; }
  .trash-row .meta b { display: block; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trash-row .meta span { font-size: 12px; color: var(--mist); }
  /* 列表视图 */
  .list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .list .row { display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .list .row:last-child { border-bottom: none; }
  .list .row:hover { background: #fafaf8; }
  .list .row.sel { background: var(--sel); }
  .list .row img { width: 56px; height: 38px; object-fit: cover; border-radius: 3px; background: #f0f0ee; flex: none; }
  .list .row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .row .f { width: 190px; color: var(--mist); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .row .n { width: 82px; color: var(--mist); font-size: 12px; text-align: right; }
  .list .row .d { width: 96px; color: var(--mist); font-size: 12px; }
  .list .row .acts { position: static; flex-direction: row; opacity: 1; }
  /* 仪表盘 */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; background: #fff; }
  .stat .k { font-size: 12px; color: var(--mist); margin-bottom: 6px; }
  .stat .v { font-size: 22px; font-weight: 300; letter-spacing: .5px; }
  .stat .v small { font-size: 12px; color: var(--mist); font-weight: 400; margin-left: 4px; }
  /* 拖拽手柄:只在手柄上按下才能排序,避免和「拖到别的项目」打架 */
  .handle { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 4px; background: rgba(0,0,0,.5); color: #fff; font-size: 12px; line-height: 22px; text-align: center; cursor: grab; opacity: 0; transition: opacity .15s; z-index: 2; }
  .ph:hover .handle, .proj:hover .handle { opacity: 1; }
  .handle:active { cursor: grabbing; }
  /* 项目卡片的把手参与流式布局、常驻可见(需求:悬停变 grab 提示可拖) */
  .proj .handle { position: static; flex: none; width: 14px; height: 18px; line-height: 18px; background: none; color: var(--mist); font-size: 13px; opacity: .45; }
  .proj:hover .handle { opacity: 1; color: var(--ink); }
  .ph.drop-before::before, .ph.drop-after::after { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--terra); z-index: 3; }
  .ph.drop-before::before { left: -7px; }
  .ph.drop-after::after { right: -7px; }
  .proj.drop-before, .proj.drop-after { position: relative; }
  .proj.drop-before::before, .proj.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--terra); }
  .proj.drop-before::before { top: -3px; }
  .proj.drop-after::after { bottom: -3px; }
  /* 可见性徽标 */
  .vis { font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--mist); }
  .vis.draft { border-style: dashed; }
  .proj.is-private .name, .proj.is-draft .name { color: var(--mist); }
  /* 项目设置 / 编辑弹窗里的多行输入 */
  .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; font: inherit; font-size: 14px; outline: none; resize: vertical; }
  .field textarea:focus { border-color: var(--terra); }
  .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; outline: none; background: #fff; }
  .field .row2 { display: flex; gap: 10px; }
  .field .row2 > div { flex: 1; }
  .modal .sect { font-size: 12px; color: var(--mist); letter-spacing: 1px; margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
  .modal .sect:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .modal.wide { width: 560px; }
  /* 标签 chips(项目页筛选 / 后台编辑预览) */
  .tagchip { display: inline-block; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--mist); cursor: pointer; background: #fff; transition: all .15s; }
  .tagchip:hover { border-color: var(--terra); color: var(--ink); }
  .tagchip.on { background: var(--terra); border-color: var(--terra); color: #fff; }
  /* 新建项目弹窗 */
  .mask { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); align-items: center; justify-content: center; }
  .mask.show { display: flex; }
  .modal { width: 440px; max-width: 92vw; background: #fff; border-radius: 8px; padding: 24px; }
  .modal h3 { font-size: 16px; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--mist); margin-bottom: 4px; }
  .field input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; outline: none; }
  .field input:focus { border-color: var(--terra); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  /* 提示 */
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .3s; z-index: 60; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 弹窗内的小节标题与复选框行 */
  .sect { font-size: 12px; color: var(--mist); margin: 14px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .modal .field:first-of-type + .sect, .sect:first-child { margin-top: 0; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 0 0 12px; cursor: pointer; }
  .chk input { width: auto; margin: 0; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="adminTitle">夏至未至 · 后台管理</h1>
    <span class="hint">仅本机可用 · 改动直接写入本地内容文件,完成后 git push 上线</span>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="chip" id="gitChip" title="Git 状态"></button>
    <button class="btn ghost" id="refresh">刷新</button>
    <button class="btn" id="addPhotos">＋ 添加照片</button>
    <button class="btn primary" id="newProject">＋ 新建项目</button>
    <button class="btn ghost" id="siteSettings" title="全局设置(站点信息与上传配置)">⚙</button>
    <button class="btn" id="gitPush" style="background:var(--ink);color:#fff;border-color:var(--ink)">🚀 推送上线</button>
  </div>
</header>

<div class="layout">
  <aside>
    <h2>项目(<span id="projTotal">0</span>)· 拖照片到卡片上移动</h2>
    <div id="projList" class="proj-scroll"></div>
    <div class="aside-foot">
      <button class="btn" id="newProject2">＋ 新建项目</button>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <h2 id="curTitle">请选择项目</h2>
      <span class="info" id="curInfo"></span>
      <button class="btn ghost" id="projSettings" title="项目设置(名称/封面/描述/可见性/删除)">⚙ 项目设置</button>
      <input class="search" id="searchBox" type="search" placeholder="搜索标题或文件名…" />
      <div class="seg" id="viewToggle">
        <button data-v="grid" class="on">网格</button><button data-v="list">列表</button>
      </div>
    </div>
    <div class="selbar" id="selbar">
      <span id="selCount">已选 0 张</span>
      <span style="color:var(--mist);font-size:12px">拖到左侧项目卡片=移动;手柄 ⋮⋮ 拖动=调整顺序</span>
      <button class="btn ghost" id="selAll" style="margin-left:auto">全选</button>
      <button class="btn ghost" id="selFeatured">设为精选</button>
      <button class="btn ghost" id="selUnfeatured">取消精选</button>
      <select class="btn ghost" id="selMove" title="批量移动到其他项目">
        <option value="">移动到…</option>
      </select>
      <button class="btn ghost" id="selBatch">批量编辑</button>
      <button class="btn ghost" id="selClear">取消选择</button>
      <button class="btn danger" id="selDelete">移入回收站</button>
    </div>
    <div class="grid" id="photoGrid"></div>
    <div class="empty" id="emptyTip">选中左侧项目查看照片;也可以先把照片拖进空项目</div>
  </main>
</div>

<!-- 新建项目弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h3>新建项目</h3>
    <div class="field"><label>项目标题 *</label><input id="f-title" placeholder="如:城市漫游 2025" /></div>
    <div class="field"><label>项目 id(网址用,留空自动生成;仅小写字母数字连字符,大写会自动转小写)</label><input id="f-id" placeholder="如:cheng-shi-man-you" /></div>
    <div class="field"><label>一句话简介(显示在项目页标题下方,可留空)</label><input id="f-desc" placeholder="镜头下的城市" /></div>
    <div class="field"><label>拍摄时间(如 2025.03 - 2025.06,可留空)</label><input id="f-date" placeholder="2025.03 - 2025.06" /></div>
    <div class="field"><label>拍摄地点(可留空)</label><input id="f-loc" placeholder="杭州" /></div>
    <div class="field"><label>封面图文件名(可留空,之后在项目 .md 里补)</label><input id="f-cover" placeholder="DSC_1234.jpg" /></div>
    <div class="actions">
      <button class="btn ghost" id="cancelModal">取消</button>
      <button class="btn primary" id="submitProject">创建</button>
    </div>
  </div>
</div>

<!-- 添加照片弹窗 -->
<div class="mask" id="maskUp">
  <div class="modal" style="width:520px">
    <h3>添加照片</h3>
    <div class="field">
      <label>归属项目 *</label>
      <select id="up-target" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px;outline:none;background:#fff"></select>
    </div>
    <div class="field">
      <label>选择图片(可多选;选择后立即检测大小,超过 10MB 的将自动压缩上传)</label>
      <input id="up-file" type="file" accept="image/jpeg,image/png,image/webp" multiple
        style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:13px" />
    </div>
    <div id="up-list" style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px"></div>
    <div class="actions">
      <button class="btn ghost" id="up-cancel">取消</button>
      <button class="btn primary" id="up-start" disabled>开始上传</button>
    </div>
  </div>
</div>

<!-- 推送上线弹窗 -->
<div class="mask" id="maskPush">
  <div class="modal" style="width:520px">
    <h3>🚀 推送上线</h3>
    <div class="field">
      <label>提交说明(commit message)</label>
      <input id="push-msg" value="后台管理更新" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px" />
    </div>
    <div id="push-log">尚未执行</div>
    <div class="actions">
      <button class="btn ghost" id="push-close">关闭</button>
      <button class="btn primary" id="push-run">开始推送</button>
    </div>
  </div>
</div>

<!-- 照片信息编辑弹窗 -->
<div class="mask" id="maskEdit">
  <div class="modal" style="width:560px">
    <h3 id="editTitle">编辑照片信息</h3>
    <div class="field"><label>标题(留空则显示文件名)</label><input id="e-title" /></div>
    <div class="field"><label>图片描述 / Alt 文本(给搜索引擎和读屏软件看,SEO 用)</label><input id="e-alt" /></div>
    <div class="field"><label>拍摄地点</label><input id="e-loc" placeholder="如:山西 · 平遥" /></div>
    <div class="field"><label>拍摄时间(显示在照片资料里)</label><input id="e-date" placeholder="2025.03" /></div>
    <div class="field"><label>标签(英文逗号分隔)</label><input id="e-tags" placeholder="古建筑, 山西" /></div>
    <div id="e-exifWrap">
      <div class="sect">拍摄参数(上传时已自动读 EXIF,可手动修正;留空即删掉该项)</div>
      <div class="field"><label>相机</label><input id="e-camera" placeholder="NIKON Z 5" /></div>
      <div style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label>镜头</label><input id="e-lens" placeholder="NIKKOR Z 24-70mm f/4 S" /></div>
        <div class="field" style="width:110px"><label>焦距</label><input id="e-focal" placeholder="63mm" /></div>
      </div>
      <div style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label>光圈</label><input id="e-aperture" placeholder="f/4" /></div>
        <div class="field" style="flex:1"><label>快门</label><input id="e-shutter" placeholder="1/125" /></div>
        <div class="field" style="flex:1"><label>ISO</label><input id="e-iso" placeholder="400" /></div>
      </div>
      <label class="chk" style="margin-top:4px">
        <input type="checkbox" id="e-showexif" />
        在灯箱里显示这些拍摄参数(不勾选则只显示照片本身)
      </label>
    </div>
    <div class="actions">
      <button class="btn ghost" id="e-cancel">取消</button>
      <button class="btn primary" id="e-save">保存</button>
    </div>
  </div>
</div>

<!-- 项目设置弹窗 -->
<div class="mask" id="maskProj">
  <div class="modal" style="width:540px">
    <h3>项目设置</h3>
    <div class="field"><label>项目名称 *</label><input id="p-title" /></div>
    <div class="field"><label>项目简介</label><input id="p-desc" /></div>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>拍摄时间</label><input id="p-date" /></div>
      <div class="field" style="flex:1"><label>拍摄地点</label><input id="p-loc" /></div>
    </div>
    <div class="field">
      <label>项目封面(下拉选当前项目的照片,也可手输文件名)</label>
      <input id="p-cover" list="p-cover-list" placeholder="DSC_1234.jpg" />
      <datalist id="p-cover-list"></datalist>
    </div>
    <div class="field">
      <label>可见性</label>
      <select id="p-vis">
        <option value="public">公开 —— 正常出现在项目列表与首页</option>
        <option value="private">私密 —— 线上不显示,直链也打不开</option>
        <option value="draft">草稿 —— 同私密,标记为未完成</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn danger" id="p-del">删除整个项目</button>
      <span style="margin-left:auto;display:flex;gap:8px">
        <button class="btn ghost" id="p-cancel">取消</button>
        <button class="btn primary" id="p-save">保存</button>
      </span>
    </div>
  </div>
</div>

      <button class="btn primary" id="b-save">应用</button>

<div class="mask" id="maskSite">
  <div class="modal" style="width:600px">
    <h3>全局设置</h3>
    <div class="sect">站点信息(留空 = 用代码里的默认值;保存后要推送上线才生效)</div>
    <div class="field"><label>网站标题</label><input id="s-title" /></div>
    <div class="field"><label>网站描述(SEO 与分享卡片)</label><input id="s-desc" /></div>
    <div class="field"><label>Logo 图片地址(留空则只显示站名文字)</label><input id="s-logo" /></div>
    <div class="field"><label>页脚文字</label><input id="s-footer" /></div>
    <div class="field"><label>备案号(留空则不显示备案行)</label><input id="s-icp" /></div>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>小红书链接</label><input id="s-xhs" /></div>
      <div class="field" style="flex:1"><label>Instagram 链接</label><input id="s-ig" /></div>
    </div>
    <div class="field"><label>联系邮箱</label><input id="s-mail" /></div>

    <label class="chk"><input type="checkbox" id="s-compress" /> 超过阈值自动压缩后上传</label>
    <div class="field" style="width:220px"><label>压缩阈值(MB)</label><input id="s-threshold" type="number" min="1" step="1" /></div>
    <label class="chk"><input type="checkbox" id="s-webp" /> 上传时额外转 WebP(Cloudinary 交付时已自动转,通常不必开)</label>

<div id="toast"></div>

<script>
// 后台管理前端(纯原生 JS,配合 scripts/admin-server.mjs)
(function () {
  var state = {
    projects: [], photos: [], featured: [], trash: [],
    current: null,           // 项目 id / "__hero__" / "__trash__"
    selected: new Set(),
    lastSelId: null,         // Shift 连选的锚点
    view: "grid",            // grid | list
    query: "",               // 当前项目内的搜索词
    cloudName: "",
    settings: null,          // 上传配置(admin/settings.json)
    git: null,               // { changes, lastCommit }
  };
  var $ = function (id) { return document.getElementById(id); };

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2400);
  }

  function thumb(filename) {
    var id = String(filename).replace(/\.[^.]+$/, "");
    return "https://res.cloudinary.com/" + state.cloudName +
      "/image/upload/f_auto,q_auto,w_400/photos/" + id;
  }

  function load() {
    Promise.all([
      fetch("/api/config").then(function (r) { return r.json(); }),
      fetch("/api/projects").then(function (r) { return r.json(); }),
      fetch("/api/photos").then(function (r) { return r.json(); }),
      fetch("/api/featured").then(function (r) { return r.json(); }),
      fetch("/api/trash").then(function (r) { return r.json(); }).catch(function () { return []; }),
      fetch("/api/git-status").then(function (r) { return r.json(); }).catch(function () { return null; }),
    ]).then(function (rs) {
      state.cloudName = rs[0].cloudName;
      state.projects = rs[1];
      state.photos = rs[2];
      state.featured = rs[3];
      state.trash = rs[4] || [];
      state.git = rs[5];
      var special = state.current === "__hero__" || state.current === "__trash__";
      if (!special && state.current &&
        !state.projects.some(function (p) { return p.id === state.current; })) {
        state.current = null;
      }
      state.selected.clear();
      state.lastSelId = null;
      render();
      renderGitChip();
    }).catch(function (e) { toast("加载失败:" + e.message); });
  }

  // 头部 Git 状态:未提交更改数 + 上次提交时间,点击直达推送弹窗
  function renderGitChip() {
    var el = $("gitChip");
    var g = state.git;
    if (!g) { el.textContent = ""; return; }
    var n = g.changes || 0;
    var when = g.lastCommit && g.lastCommit.date ? relTime(g.lastCommit.date) : "还没提交过";
    el.innerHTML = n > 0
      ? '<b>' + n + '</b> 项更改待推送 · 上次推送 ' + esc(when)
      : '无未推送改动 · 上次推送 ' + esc(when);
    el.classList.toggle("dirty", n > 0);
    el.title = n > 0 ? "点击推送上线" : "点击查看推送";
  }

  function relTime(iso) {
    var t = new Date(iso.replace(" ", "T")).getTime();
    if (isNaN(t)) return iso;
    var d = Math.floor((Date.now() - t) / 1000);
    if (d < 60) return "刚刚";
    if (d < 3600) return Math.floor(d / 60) + " 分钟前";
    if (d < 86400) return Math.floor(d / 3600) + " 小时前";
    return Math.floor(d / 86400) + " 天前";
  }

  function photosOf(pid) {
    if (pid === "__hero__") {
      return state.featured.map(function (f) {
        return { id: f.id, filename: f.filename, title: f.title, isHero: true };
      });
    }
    return state.photos.filter(function (p) { return p.project === pid; });
  }

  function render() {
    renderSidebar();
    renderMain();
    renderSelbar();
  }

  // 通用「照片放置区」:拖照片到元素上 = 移动/加入。
  // 只接管带 text/plain 的拖拽(排序手柄用的是 x-reorder),两者互不干扰。
  function bindDrop(el, cb) {
    el.addEventListener("dragover", function (e) {
      if (!e.dataTransfer.types.includes("text/plain")) return;
      e.preventDefault();
      el.classList.add("dragover");
    });
    el.addEventListener("dragleave", function () { el.classList.remove("dragover"); });
    el.addEventListener("drop", function (e) {
      if (!e.dataTransfer.types.includes("text/plain")) return;
      e.preventDefault();
      el.classList.remove("dragover");
      var ids = JSON.parse(e.dataTransfer.getData("text/plain") || "[]");
      if (ids.length) cb(ids);
    });
  }

  // ---------- 左侧:项目列表 ----------
  function renderSidebar() {
    // 顶部固定一张「首页 Hero 轮播」卡片,拖照片进去即上首页
    $("projTotal").textContent = state.projects.length;
    var list = $("projList");
    list.innerHTML = "";
    var heroDiv = document.createElement("div");
    heroDiv.className = "proj" + (state.current === "__hero__" ? " active" : "");
    heroDiv.innerHTML =
      '<span class="name">🏠 首页 Hero 轮播</span>' +
      '<span class="count">' + state.featured.length + " 张</span>";
    heroDiv.title = "首页主体大图轮播:拖照片进来即加入,✕ 移出";
    heroDiv.addEventListener("click", function () {
      if (state.selected.size > 0) {
        addHero(Array.from(state.selected));
        return;
      }
      state.current = "__hero__";
      state.selected.clear();
      state.query = "";
      render();
    });
    bindDrop(heroDiv, function (ids) { addHero(ids); });
    list.appendChild(heroDiv);
    state.projects.forEach(function (p, idx) {
      var vis = p.visibility || "public";
      var div = document.createElement("div");
      div.className = "proj" + (p.id === state.current ? " active" : "") +
        (vis === "private" ? " is-private" : vis === "draft" ? " is-draft" : "");
      div.innerHTML =
        '<span class="handle" draggable="true" title="拖拽调整项目顺序">⋮⋮</span>' +
        '<span class="name">' + esc(p.title || p.id) + "</span>" +
        (vis === "public"
          ? ""
          : '<span class="vis ' + vis + '">' + (vis === "private" ? "私密" : "草稿") + "</span>") +
        '<span class="count">' + p.count + " 张</span>" +
        '<button class="del" title="删除项目">✕</button>';
      div.querySelector(".del").addEventListener("click", function (e) {
        e.stopPropagation();
        if (!confirm("确定删除项目「" + (p.title || p.id) + "」?\n(项目里还有照片时会被拦截)删除后不可恢复。")) return;
        fetch("/api/project", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: p.id }),
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (res.error) { toast("删除失败:" + res.error); return; }
          toast("项目已删除:" + p.id);
          if (state.current === p.id) state.current = null;
          load();
        }).catch(function (e) { toast("删除失败:" + e.message); });
      });
      div.title = (p.description ? p.description + "\n" : "") +
        (p.date ? p.date + " " : "") + (p.location || "");
      div.addEventListener("click", function () {
        if (state.selected.size > 0 && p.id !== state.current) {
          move(Array.from(state.selected), p.id); // 点选照片后点目标项目 = 移动
        } else {
          state.current = p.id;
          state.selected.clear();
          state.query = "";
          render();
        }
      });
      bindDrop(div, function (ids) { move(ids, p.id); });
      bindReorder(div.querySelector(".handle"), div, "project", idx);
      list.appendChild(div);
    });

    // 底部固定条目:回收站
    var tr = document.createElement("div");
    tr.className = "proj" + (state.current === "__trash__" ? " active" : "");
    tr.innerHTML =
      '<span class="name">🗑 回收站</span>' +
      '<span class="count">' + state.trash.length + " 张</span>";
    tr.title = "删除的照片先放这里,可恢复或彻底删除";
    tr.addEventListener("click", function () {
      state.current = "__trash__";
      state.selected.clear();
      state.query = "";
      render();
    });
    list.appendChild(tr);
  }

  // ---------- 右侧主区:仪表盘 / 项目照片 / Hero 轮播 / 回收站 ----------
  function renderMain() {
    var grid = $("photoGrid");
    var tip = $("emptyTip");
    var cur = state.projects.find(function (p) { return p.id === state.current; });
    var isHero = state.current === "__hero__";
    var isTrash = state.current === "__trash__";

    $("projSettings").style.display = cur ? "" : "none";
    $("searchBox").style.display = cur || isHero ? "" : "none";
    $("viewToggle").style.display = cur || isHero ? "" : "none";
    // 只在外部改动过 query 时才回写,否则打字时每次 render 光标都会跳到末尾
    if ($("searchBox").value !== state.query) $("searchBox").value = state.query;
    tip.style.display = "none";
    grid.innerHTML = "";
    grid.className = "grid";

    if (isTrash) {
      $("curTitle").textContent = "回收站";
      $("curInfo").textContent = "恢复会还原全部标记(含精选);彻底删除会连云端原图一起删,不可恢复";
      renderTrash();
      return;
    }
    if (!cur && !isHero) {
      $("curTitle").textContent = "仪表盘";
      $("curInfo").textContent = "左侧选中项目即可管理照片";
      renderDashboard();
      return;
    }

    if (isHero) {
      $("curTitle").textContent = "首页 Hero 轮播";
      $("curInfo").textContent = "拖照片到左侧该卡片即加入;手柄 ⋮⋮ 调整轮播顺序;悬停 ✕ 移出";
    } else {
      $("curTitle").textContent = cur.title || cur.id;
      $("curInfo").textContent = [cur.date || "", cur.location || ""].filter(Boolean).join(" · ");
    }

    var items = photosOf(state.current);
    var q = state.query.trim().toLowerCase();
    if (q) {
      items = items.filter(function (p) {
        return [p.title, p.id, p.filename].some(function (v) {
          return String(v || "").toLowerCase().indexOf(q) >= 0;
        });
      });
    }
    if (!items.length) {
      tip.style.display = "";
      tip.textContent = q
        ? "没有匹配「" + state.query + "」的照片"
        : isHero
          ? "还没有 Hero 图 —— 在任意项目选中照片,拖到左侧「🏠 首页 Hero 轮播」卡片即可加入"
          : "该项目还没有照片 —— 去左侧其他项目选中照片拖过来,或用「添加照片」上传";
      return;
    }
    if (state.view === "list") grid.className = "list";
    // 搜索过滤时禁用排序:可见顺序与真实顺序不一致,拖拽结果会反直觉
    items.forEach(function (p, i) {
      grid.appendChild(
        state.view === "list" ? listRow(p, cur, i, !q) : photoTile(p, cur, i, !q),
      );
    });
  }

  // 网格瓦片
  function photoTile(p, cur, idx, canReorder) {
    var isHeroItem = !!p.isHero;
    var isCover = !isHeroItem && cur && p.filename === cur.coverImage;
    var div = document.createElement("div");
    div.className = "ph" + (!isHeroItem && state.selected.has(p.id) ? " sel" : "");
    div.draggable = !isHeroItem; // Hero 条目整体拖拽无意义,只能用手柄排序
    var acts =
      '<button class="act edit" title="编辑信息(标题/描述/拍摄参数/地点/标签)">✎</button>' +
      (isHeroItem
        ? ""
        : '<button class="act star" title="设为精选(上首页 12 张精选墙)">★</button>' +
          '<button class="act cover" title="设为「' + esc(cur ? cur.title : "") + '」项目封面">▣</button>') +
      '<button class="act dl" title="下载原图">⬇</button>' +
      '<button class="act del" title="' +
      (isHeroItem ? "移出首页 Hero 轮播" : "移入回收站") +
      '">✕</button>';
    div.innerHTML =
      (canReorder ? '<span class="handle" draggable="true" title="拖拽调整展示顺序">⋮⋮</span>' : "") +
      '<img loading="lazy" src="' + thumb(p.filename) + '" alt="' + esc(p.alt || "") + '" />' +
      '<span class="tag">' + esc(p.title || p.id) + "</span>" +
      '<div style="position:absolute;top:4px;left:30px;display:flex;flex-direction:column;gap:4px;align-items:flex-start">' +
      (p.featured ? '<span class="badge">精选</span>' : "") +
      (isCover ? '<span class="badge">封面</span>' : "") +
      "</div>" +
      '<div class="acts">' + acts + "</div>";

    div.querySelector(".edit").addEventListener("click", function (e) {
      e.stopPropagation();
      openEdit(p, isHeroItem ? "featured" : "photos");
    });
    div.querySelector(".dl").addEventListener("click", function (e) {
      e.stopPropagation();
      downloadOriginal(p.filename);
    });
    div.querySelector(".del").addEventListener("click", function (e) {
      e.stopPropagation();
      if (isHeroItem) {
        if (!confirm("把「" + (p.title || p.filename) + "」移出首页 Hero 轮播?\n(不影响项目里的照片)")) return;
        fetch("/api/featured", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: [p.id] }),
        }).then(function () { toast("已移出首页 Hero"); load(); })
          .catch(function (e2) { toast("操作失败:" + e2.message); });
        return;
      }
      if (!confirm("把照片「" + (p.title || p.id) + "」移入回收站?\n可在回收站恢复;彻底删除时才清理云端原图。")) return;
      delPhotos([p.id]);
    });

    if (!isHeroItem) {
      div.querySelector(".star").addEventListener("click", function (e) {
        e.stopPropagation();
        fetch("/api/featured-flag", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: [p.id], value: !p.featured }),
        }).then(function () { toast(p.featured ? "已取消精选" : "已设为精选(上首页精选墙)"); load(); })
          .catch(function (e2) { toast("操作失败:" + e2.message); });
      });
      div.querySelector(".cover").addEventListener("click", function (e) {
        e.stopPropagation();
        fetch("/api/project-cover", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ projectId: state.current, filename: p.filename }),
        }).then(function (r) { return r.json(); }).then(function (res) {
          toast(res.error ? "设置失败:" + res.error : "已设为「" + (cur ? cur.title : "") + "」封面");
          load();
        }).catch(function (e2) { toast("操作失败:" + e2.message); });
      });
      div.addEventListener("click", function (e) { onPick(p.id, idx, e); });
      // 整体拖拽 = 移动到别的项目(与手柄排序互不干扰)
      div.addEventListener("dragstart", function (e) {
        if (!state.selected.has(p.id)) { // 拖动未选中的图 = 只拖这一张
          state.selected.clear();
          state.selected.add(p.id);
        }
        e.dataTransfer.setData("text/plain", JSON.stringify(Array.from(state.selected)));
        div.classList.add("dragging");
      });
      div.addEventListener("dragend", function () { div.classList.remove("dragging"); });
    }
    if (canReorder) {
      var h = div.querySelector(".handle");
      // 手柄的 dragstart 要压过瓦片自身的(瓦片只设 text/plain,手柄只设 x-reorder)
      h.addEventListener("dragstart", function () { div.draggable = false; });
      h.addEventListener("dragend", function () { div.draggable = !isHeroItem; });
      bindReorder(h, div, isHeroItem ? "hero" : "photo", idx);
    }
    return div;
  }

  // 列表视图行:一眼看到大小/尺寸/上传时间
  function listRow(p, cur, idx, canReorder) {
    var isHeroItem = !!p.isHero;
    var isCover = !isHeroItem && cur && p.filename === cur.coverImage;
    var div = document.createElement("div");
    div.className = "row" + (!isHeroItem && state.selected.has(p.id) ? " sel" : "");
    div.draggable = !isHeroItem;
    var size = typeof p.bytes === "number" ? fmtSize(p.bytes) : "—";
    var dim = p.width && p.height ? p.width + "×" + p.height : "—";
    var up = p.uploadedAt ? String(p.uploadedAt).slice(0, 10) : "—";
    div.innerHTML =
      '<img loading="lazy" src="' + thumb(p.filename) + '" alt="" />' +
      '<span class="t">' + esc(p.title || p.id) +
      (p.featured ? ' <span class="badge">精选</span>' : "") +
      (isCover ? ' <span class="badge">封面</span>' : "") + "</span>" +
      '<span class="f">' + esc(p.filename || "") + "</span>" +
      '<span class="d">' + esc(dim) + "</span>" +
      '<span class="n">' + esc(size) + "</span>" +
      '<span class="d">' + esc(up) + "</span>" +
      '<span class="acts">' +
      '<button class="act edit" title="编辑信息">✎</button>' +
      '<button class="act dl" title="下载原图">⬇</button>' +
      '<button class="act del" title="' + (isHeroItem ? "移出 Hero 轮播" : "移入回收站") + '">✕</button>' +
      "</span>";
    div.querySelector(".edit").addEventListener("click", function (e) {
      e.stopPropagation();
      openEdit(p, isHeroItem ? "featured" : "photos");
    });
    div.querySelector(".dl").addEventListener("click", function (e) {
      e.stopPropagation();
      downloadOriginal(p.filename);
    });
    div.querySelector(".del").addEventListener("click", function (e) {
      e.stopPropagation();
      if (isHeroItem) {
        if (!confirm("把「" + (p.title || p.filename) + "」移出首页 Hero 轮播?")) return;
        fetch("/api/featured", {
          method: "DELETE", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: [p.id] }),
        }).then(function () { toast("已移出首页 Hero"); load(); });
        return;
      }
      if (!confirm("把照片「" + (p.title || p.id) + "」移入回收站?")) return;
      delPhotos([p.id]);
    });
    if (!isHeroItem) {
      div.addEventListener("click", function (e) { onPick(p.id, idx, e); });
      div.addEventListener("dragstart", function (e) {
        if (!state.selected.has(p.id)) { state.selected.clear(); state.selected.add(p.id); }
        e.dataTransfer.setData("text/plain", JSON.stringify(Array.from(state.selected)));
      });
    }
    return div;
  }

  // 单击 = 单选替换;Ctrl/Cmd+单击 = 加减选;Shift+单击 = 从锚点连选
  function onPick(id, idx, e) {
    var items = photosOf(state.current);
    if (e.shiftKey && state.lastSelId) {
      var a = items.findIndex(function (x) { return x.id === state.lastSelId; });
      var b = idx;
      if (a >= 0) {
        state.selected.clear();
        for (var i = Math.min(a, b); i <= Math.max(a, b); i++) state.selected.add(items[i].id);
      }
    } else if (e.ctrlKey || e.metaKey) {
      if (state.selected.has(id)) state.selected.delete(id);
      else state.selected.add(id);
      state.lastSelId = id;
    } else {
      state.selected.clear();
      state.selected.add(id);
      state.lastSelId = id;
    }
    render();
  }

  // ---------- 拖拽排序 ----------
  var dragCtx = null; // { kind, index }

  function bindReorder(handle, el, kind, index) {
    if (!handle) return;
    handle.addEventListener("dragstart", function (e) {
      dragCtx = { kind: kind, index: index };
      e.dataTransfer.effectAllowed = "move";
      // 自定义类型:排序拖拽与「拖到项目里移动照片」靠类型区分,互不误触
      e.dataTransfer.setData("application/x-reorder", String(index));
      el.classList.add("dragging");
      e.stopPropagation();
    });
    var clearMarks = function () {
      document.querySelectorAll(".drop-before,.drop-after").forEach(function (n) {
        n.classList.remove("drop-before", "drop-after");
      });
    };
    handle.addEventListener("dragend", function () {
      dragCtx = null;
      el.classList.remove("dragging");
      clearMarks();
    });
    el.addEventListener("dragover", function (e) {
      if (!dragCtx || dragCtx.kind !== kind) return;
      e.preventDefault();
      e.stopPropagation();
      var r = el.getBoundingClientRect();
      // 列表是竖排、网格是横排:按对应轴判断插到前还是后
      var after = el.closest(".list, .proj, #projList")
        ? e.clientY > r.top + r.height / 2
        : e.clientX > r.left + r.width / 2;
      el.classList.toggle("drop-after", after);
      el.classList.toggle("drop-before", !after);
    });
    el.addEventListener("dragleave", function () {
      el.classList.remove("drop-before", "drop-after");
    });
    el.addEventListener("drop", function (e) {
      if (!dragCtx || dragCtx.kind !== kind) return;
      e.preventDefault();
      e.stopPropagation();
      var after = el.classList.contains("drop-after");
      var from = dragCtx.index;
      clearMarks();
      dragCtx = null;
      el.classList.remove("dragging");
      reorder(kind, from, index, after);
    });
  }

  function reorder(kind, from, to, after) {
    var arr =
      kind === "project" ? state.projects.map(function (p) { return p.id; }) :
      kind === "hero" ? state.featured.map(function (f) { return f.id; }) :
      photosOf(state.current).map(function (p) { return p.id; });
    if (from === to) return;
    var moved = arr.splice(from, 1)[0];
    if (moved === undefined) return;
    // 移除后目标索引会前移一位
    var t2 = to > from ? to - 1 : to;
    arr.splice(after ? t2 + 1 : t2, 0, moved);

    var url =
      kind === "project" ? "/api/project-order" :
      kind === "hero" ? "/api/featured-order" : "/api/photo-order";
    var payload =
      kind === "photo" ? { projectId: state.current, orderedIds: arr } : { orderedIds: arr };

    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.error) { toast("排序失败:" + res.error); load(); return; }
      applyOrder(kind, arr);
      toast("顺序已更新(推送后线上生效)");
    }).catch(function (e) { toast("排序失败:" + e.message); load(); });
  }

  // 本地先按新顺序重排,避免整页刷新闪烁;随后 load() 与磁盘对齐
  function applyOrder(kind, ids) {
    var pos = {};
    ids.forEach(function (id, i) { pos[id] = i; });
    var list = kind === "project" ? state.projects : kind === "hero" ? state.featured : state.photos;
    list.sort(function (a, b) {
      var pa = pos[a.id] === undefined ? Infinity : pos[a.id];
      var pb = pos[b.id] === undefined ? Infinity : pos[b.id];
      return pa - pb;
    });
    render();
  }

  function renderSelbar() {
    $("selbar").classList.toggle("show", state.selected.size > 0);
    $("selCount").textContent = "已选 " + state.selected.size + " 张";

  function move(ids, target) {

        (bad.length ? "(失败:" + bad.map(function (x) { return x.id; }).join(",") + ")" : ""));

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // 新建项目
  var mask = $("mask");
  function openNewProject() { mask.classList.add("show"); $("f-title").focus(); }
  $("newProject").addEventListener("click", openNewProject);

  // ---------- 添加照片:选择文件即检测大小,>10MB 自动压缩上传(逻辑同 add-photos) ----------
  var maskUp = $("maskUp");
  var upFiles = []; // {file, name, size, over, status, el, compressed, err}

  function fmtSize(b) {
    if (b >= 1048576) return (b / 1048576).toFixed(1) + " MB";
    if (b >= 1024) return (b / 1024).toFixed(0) + " KB";
    return b + " B";
  }

  function fillTarget() {
    var sel = $("up-target");
    sel.innerHTML = "";
    state.projects.forEach(function (p) {
      var o = document.createElement("option");
      o.value = p.id;
      o.textContent = (p.title || p.id) + "(" + p.count + " 张)";
      if (p.id === state.current) o.selected = true;
      sel.appendChild(o);
    });
    var f = document.createElement("option");
    f.value = "__featured__";
    f.textContent = "🏠 首页 Hero 轮播图(不归属项目)";
    sel.appendChild(f);
  }

  $("addPhotos").addEventListener("click", function () {
    fillTarget();
    upFiles = [];
    $("up-file").value = "";
    renderUpList();
    $("up-start").disabled = true;
    maskUp.classList.add("show");
  });
  $("up-cancel").addEventListener("click", function () { maskUp.classList.remove("show"); });
  maskUp.addEventListener("click", function (e) { if (e.target === maskUp) maskUp.classList.remove("show"); });

  $("up-file").addEventListener("change", function () {
    upFiles = Array.from(this.files).map(function (f) {
      var over = f.size > 10 * 1024 * 1024;
      var dup = state.photos.some(function (p) { return p.id === f.name.replace(/\.[^.]+$/, ""); });
      return { file: f, name: f.name, size: f.size, over: over, dup: dup, status: dup ? "skip" : "wait" };
    });
    renderUpList();
    $("up-start").disabled = upFiles.length === 0;
  });

  function renderUpList() {
    var box = $("up-list");
    if (!upFiles.length) {
      box.innerHTML = '<div style="color:var(--mist);padding:6px">尚未选择文件</div>';
      return;
    }
    box.innerHTML = "";
    upFiles.forEach(function (it) {
      var div = document.createElement("div");
      div.style.cssText = "display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)";
      div.innerHTML =
        '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(it.name) + "</span>" +
        '<span style="color:var(--mist);font-size:12px">' + fmtSize(it.size) +
        (it.over ? " · <b style='color:#b38a4f'>超10MB将压缩</b>" : "") + "</span>" +
        '<span class="st" style="font-size:12px;min-width:70px;text-align:right"></span>';
      it.el = div.querySelector(".st");
      box.appendChild(div);
    });
    updateUpStatuses();
  }

  function updateUpStatuses() {
    upFiles.forEach(function (it) {
      if (!it.el) return;
      if (it.status === "skip") it.el.innerHTML = '<span style="color:var(--mist)">已存在,跳过</span>';
      else if (it.status === "wait") it.el.innerHTML = '<span style="color:var(--mist)">待上传</span>';
      else if (it.status === "up") it.el.innerHTML = '<span style="color:var(--terra)">上传中…</span>';
      else if (it.status === "ok") it.el.innerHTML = '<span style="color:#3a7d44">✓ ' + (it.compressed ? "已压缩" : "成功") + "</span>";
      else if (it.status === "err") it.el.innerHTML = '<span style="color:#b0392e" title="' + esc(it.err || "") + '">✗ 失败</span>';
    });
  }

  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(",")[1] || ""); };
      r.onerror = function () { reject(new Error("读取失败")); };
      r.readAsDataURL(file);
    });
  }

  $("up-start").addEventListener("click", async function () {
    var todo = upFiles.filter(function (it) { return it.status !== "skip"; });
    if (!todo.length) { toast("没有需要上传的文件"); return; }
    var target = $("up-target").value;
    var featured = target === "__featured__";
    var project = featured ? "" : target;
    $("up-start").disabled = true;
    var okN = 0, compN = 0, failN = 0, skipN = upFiles.length - todo.length;
    for (var i = 0; i < todo.length; i++) {
      var it = todo[i];
      it.status = "up";
      updateUpStatuses();
      try {
        var b64 = await readBase64(it.file);
        var r = await fetch("/api/add-photo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ files: [{ name: it.name, data: b64 }], project: project, featured: featured }),
        });
        var res = await r.json();
        var one = res.error ? { ok: false, error: res.error } : (res.results || [])[0];
        if (one.ok) {
          it.status = "ok";
          it.compressed = one.compressed;
          if (one.compressed) compN++; else okN++;
        } else if (one.skipped) {
          it.status = "skip";
          skipN++;
        } else {
          it.status = "err";
          it.err = one.error || "未知错误";
          failN++;
        }
      } catch (e) {
        it.status = "err";
        it.err = e.message;
        failN++;
      }
      updateUpStatuses();
    }
    $("up-start").disabled = false;
    toast("上传完成:成功 " + (okN + compN) + " 张(压缩 " + compN + " 张)/ 跳过 " + skipN + " / 失败 " + failN + " —— 记得 git push");
    load();
  });

  // ---------- 删除照片:移入回收站(云端原图保留,彻底删除在回收站里做) ----------
  function delPhotos(ids) {
    fetch("/api/photo", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: ids }),
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.error) { toast("删除失败:" + res.error); return; }
      var rs = res.results || [];
      var ok = rs.filter(function (x) { return x.ok; }).length;
      // 联动清理要说清楚,否则用户不知道封面/精选被动了
      var extra = [];
      if (rs.some(function (x) { return x.heroRemoved; })) extra.push("已移出首页 Hero");
      var covers = rs.filter(function (x) { return x.coverCleared; }).map(function (x) { return x.coverCleared; });
      if (covers.length) extra.push("已清空 " + covers.join("、") + " 的项目封面");
      toast("已移入回收站 " + ok + "/" + ids.length + " 张" +
        (extra.length ? "(" + extra.join(";") + ")" : "") + " —— 云端原图仍在");
      state.selected.clear();
      load();
    }).catch(function (e) { toast("删除失败:" + e.message); });
  }

  $("selDelete").addEventListener("click", function () {
    var n = state.selected.size;
    if (!n) return;
    if (!confirm("把所选 " + n + " 张照片移入回收站?\n可以在回收站恢复;只有「彻底删除」才会删云端原图。")) return;
    delPhotos(Array.from(state.selected));

  // 设为/取消精选共用一个入口

  // ---------- 加入首页 Hero(拖拽/点选后点 Hero 卡片) ----------
  function addHero(ids) {
    var files = ids.map(function (id) {
      var ph = state.photos.find(function (x) { return x.id === id; });
      return { filename: ph ? ph.filename : id };
    });
    fetch("/api/featured", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ files: files }),
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.error) { toast("加入失败:" + res.error); return; }
      var added = (res.results || []).filter(function (x) { return x.ok && !x.exists; }).length;
      var dup = (res.results || []).filter(function (x) { return x.exists; }).length;
      toast("已加入首页 Hero " + added + " 张" + (dup ? "(重复跳过 " + dup + " 张)" : ""));
      state.selected.clear();
      load();
    }).catch(function (e) { toast("加入失败:" + e.message); });
  }

  // ---------- 弹窗通用:点遮罩/取消/ESC 关闭 ----------
  var maskStack = [];
  function openMask(id) {
    $(id).classList.add("show");
    maskStack.push(id);
  }
  function closeMask(id) {
    $(id).classList.remove("show");
    maskStack = maskStack.filter(function (x) { return x !== id; });
  }
  document.querySelectorAll(".mask").forEach(function (m) {
    // 点遮罩空白处关闭(点内容区不关)
    m.addEventListener("click", function (e) { if (e.target === m) closeMask(m.id); });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && maskStack.length) closeMask(maskStack[maskStack.length - 1]);
  });

  // 弹窗里统一用 PUT JSON,拿到 error 就抛
  function putJson(url, body) {
    return fetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.error) throw new Error(res.error);
      return res;
    });
  }

  // ---------- 单张照片信息编辑 ----------
  var editCtx = null; // { id, collection }

  function openEdit(p, collection) {
    var isHero = collection === "featured";
    editCtx = { id: p.id, collection: collection };
    $("editTitle").textContent = isHero ? "编辑 Hero 轮播条目" : "编辑照片信息";
    $("e-exifWrap").style.display = isHero ? "none" : "";
    // 地点/日期/标签只存在于 photos 集合(featured 的文件里没有这些键)
    ["e-loc", "e-date", "e-tags"].forEach(function (id) {
      $(id).closest(".field").style.display = isHero ? "none" : "";
    });
    $("e-title").value = p.title || "";
    $("e-alt").value = p.alt || "";
    $("e-loc").value = p.location || "";
    $("e-date").value = p.date || "";
    // tags 存的是数组,编辑框里用「, 」串起来
    $("e-tags").value = (Array.isArray(p.tags) ? p.tags : []).join(", ");
    var ex = p.exif || {};
    $("e-camera").value = ex.camera || "";
    $("e-lens").value = ex.lens || "";
    $("e-focal").value = ex.focalLength || "";
    $("e-aperture").value = ex.aperture || "";
    $("e-shutter").value = ex.shutter || "";
    $("e-iso").value = ex.iso == null ? "" : ex.iso;
    $("e-showexif").checked = p.showExif === true;
    openMask("maskEdit");
    $("e-title").focus();
  }

  $("e-cancel").addEventListener("click", function () { closeMask("maskEdit"); });
  $("e-save").addEventListener("click", function () {
    if (!editCtx) return;
    var isHero = editCtx.collection === "featured";
    var body = {
      id: editCtx.id,
      collection: editCtx.collection,
      title: $("e-title").value,
      alt: $("e-alt").value,
    };
    if (!isHero) {
      body.location = $("e-loc").value;
      body.date = $("e-date").value;
      body.tags = $("e-tags").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      body.exif = {
        camera: $("e-camera").value,
        lens: $("e-lens").value,
        focalLength: $("e-focal").value,
        aperture: $("e-aperture").value,
        shutter: $("e-shutter").value,
        iso: $("e-iso").value,
      };
      body.showExif = $("e-showexif").checked;
    }
    var btn = this;
    btn.disabled = true;
    putJson("/api/photo", body).then(function () {
      toast("已保存(推送后线上生效)");
      closeMask("maskEdit");
      load();
    }).catch(function (e) { toast("保存失败:" + e.message); })
      .finally(function () { btn.disabled = false; });
  });

  // ---------- 项目设置 ----------
  var projCtx = null;

  function openProjSettings() {
    var proj = state.projects.find(function (x) { return x.id === state.current; });
    if (!proj) { toast("先在左侧选中一个项目"); return; }
    projCtx = proj.id;
    $("p-title").value = proj.title || "";
    $("p-desc").value = proj.description || "";
    $("p-date").value = proj.date || "";
    $("p-loc").value = proj.location || "";
    $("p-cover").value = proj.coverImage || "";
    $("p-vis").value = proj.visibility || "public";
    // 封面下拉:当前项目的照片文件名(选中即填进去)
    var dl = $("p-cover-list");
    dl.innerHTML = "";
    state.photos.filter(function (x) { return x.project === proj.id; })
      .forEach(function (x) {
        var o = document.createElement("option");
        o.value = x.filename || "";
        o.label = x.title || x.filename || "";
        dl.appendChild(o);
      });
    openMask("maskProj");
  }

  $("projSettings").addEventListener("click", openProjSettings);
  $("p-cancel").addEventListener("click", function () { closeMask("maskProj"); });
  $("p-save").addEventListener("click", function () {
    if (!projCtx) return;
    var title = $("p-title").value.trim();
    if (!title) { toast("项目名称不能为空"); return; }
    var btn = this;
    btn.disabled = true;
    putJson("/api/project", {
      id: projCtx,
      title: title,
      description: $("p-desc").value,
      date: $("p-date").value,
      location: $("p-loc").value,
      coverImage: $("p-cover").value,
      visibility: $("p-vis").value,
    }).then(function () {
      toast("项目设置已保存(推送后线上生效)");
      closeMask("maskProj");
      load();
    }).catch(function (e) { toast("保存失败:" + e.message); })
      .finally(function () { btn.disabled = false; });
  });

  $("p-del").addEventListener("click", function () {
    if (!projCtx) return;
    var proj = state.projects.find(function (x) { return x.id === projCtx; });
    var n = proj ? proj.count : 0;
    // 二次确认:项目删除会连同其下所有照片的数据文件一起进回收站
    if (!confirm("删除整个项目「" + (proj ? proj.title || proj.id : projCtx) + "」?\n" +
      "项目下的 " + n + " 张照片会一并移入回收站(可在回收站恢复)。")) return;
    if (!confirm("再确认一次:确定删除「" + (proj ? proj.title || proj.id : projCtx) + "」?")) return;
    fetch("/api/project", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: projCtx }),
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.error) { toast("删除失败:" + res.error); return; }
      toast("已删除项目,照片已移入回收站");
      closeMask("maskProj");
      state.current = null;
      load();
    }).catch(function (e) { toast("删除失败:" + e.message); });
  });

  // ---------- 批量编辑(标签 / 地点) ----------
  function openBatchEdit() {
    var n = state.selected.size;
    if (!n) return;
    $("b-n").textContent = "(已选 " + n + " 张)";
    $("b-tags").value = "";
    $("b-loc").value = "";
    $("b-tags-clear").checked = false;
    $("b-loc-clear").checked = false;
    $("b-showexif").value = ""; // 默认「不修改」
    openMask("maskBatch");
  }

  $("selBatch").addEventListener("click", openBatchEdit);
  $("b-cancel").addEventListener("click", function () { closeMask("maskBatch"); });
  // 勾了「清空」就把输入框禁用掉,避免两种意图打架
  $("b-tags-clear").addEventListener("change", function () {
    $("b-tags").disabled = this.checked;
    if (this.checked) $("b-tags").value = "";
  });
  $("b-loc-clear").addEventListener("change", function () {
    $("b-loc").disabled = this.checked;
    if (this.checked) $("b-loc").value = "";
  });
  $("b-save").addEventListener("click", function () {
    var ids = Array.from(state.selected);
    if (!ids.length) return;
    var set = {};
    if ($("b-tags-clear").checked) set.tags = [];
    else if ($("b-tags").value.trim()) {
      set.tags = $("b-tags").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    }
    if ($("b-loc-clear").checked) set.location = "";
    else if ($("b-loc").value.trim()) set.location = $("b-loc").value.trim();
    // 三态:"" = 不修改(不传这个键), "1" = 打开, "0" = 关闭
    if ($("b-showexif").value !== "") set.showExif = $("b-showexif").value === "1";
    if (!Object.keys(set).length) { toast("没有要修改的内容"); return; }

    var btn = this;
    btn.disabled = true;
    fetch("/api/photos-batch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: ids, set: set }),
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.error) { toast("失败:" + res.error); return; }
      var bad = (res.results || []).filter(function (x) { return !x.ok; });
      toast("已更新 " + (ids.length - bad.length) + "/" + ids.length + " 张" +
        (bad.length ? "(失败 " + bad.length + " 张)" : "") + " —— 推送后线上生效");
      closeMask("maskBatch");
      state.selected.clear();
      load();
    }).catch(function (e) { toast("失败:" + e.message); })
      .finally(function () { btn.disabled = false; });
  });

  // ---------- 全局设置(站点信息 + 上传配置) ----------
  function openSiteSettings() {
    fetch("/api/site-settings").then(function (r) { return r.json(); }).then(function (s) {
      $("s-title").value = s.title || "";
      $("s-desc").value = s.description || "";
      $("s-logo").value = s.logo || "";
      $("s-footer").value = s.footerText || "";
      $("s-icp").value = s.icp || "";
      $("s-xhs").value = s.socialXhs || "";
      $("s-ig").value = s.socialInstagram || "";
      $("s-mail").value = s.contactEmail || "";
    }).catch(function () { toast("读取站点设置失败"); });

    fetch("/api/admin-settings").then(function (r) { return r.json(); }).then(function (a) {
      $("s-compress").checked = !!a.autoCompress;
      $("s-threshold").value = a.compressThresholdMB;
      $("s-webp").checked = !!a.autoWebp;
    }).catch(function () {});

    openMask("maskSite");
  }

  $("siteSettings").addEventListener("click", openSiteSettings);
  $("s-cancel").addEventListener("click", function () { closeMask("maskSite"); });
  $("s-save").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    Promise.all([
      putJson("/api/site-settings", {
        title: $("s-title").value,
        description: $("s-desc").value,
        logo: $("s-logo").value,
        footerText: $("s-footer").value,
        icp: $("s-icp").value,
        socialXhs: $("s-xhs").value,
        socialInstagram: $("s-ig").value,
        contactEmail: $("s-mail").value,
      }),
      putJson("/api/admin-settings", {
        autoCompress: $("s-compress").checked,
        compressThresholdMB: $("s-threshold").value,
        autoWebp: $("s-webp").checked,
      }),
    ]).then(function (rs) {
      // 站名改了顺便更新后台自己的标题,一眼能看出生效
      var t = rs[0] && rs[0].title;
      if (t) $("adminTitle").textContent = t + " · 后台管理";
      toast("已保存 —— 站点信息推送后生效,上传配置立即生效");
      closeMask("maskSite");
    }).catch(function (e) { toast("保存失败:" + e.message); })
      .finally(function () { btn.disabled = false; });
  });

  // ---------- 推送上线:构建检查 → commit → push ----------
  var maskPush = $("maskPush");
  $("gitPush").addEventListener("click", function () {
    $("push-log").textContent = "尚未执行";
    maskPush.classList.add("show");
  });
  $("push-close").addEventListener("click", function () { maskPush.classList.remove("show"); });
  maskPush.addEventListener("click", function (e) { if (e.target === maskPush) maskPush.classList.remove("show"); });
  $("push-run").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    $("push-log").textContent = "执行中(构建约 10 秒,请稍候)…";
    fetch("/api/push", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: $("push-msg").value.trim() }),
    }).then(function (r) { return r.json(); }).then(function (res) {
      $("push-log").textContent = (res.log || []).join("\n");
      if (res.ok) {
        var h = res.summary && res.summary.hash ? " commit " + res.summary.hash : "";
        toast("✓ 已推送" + h + ",Cloudflare 正在自动部署");
        load(); // 刷新后未推送改动数归零
      } else {
        // 失败时把首行错误摆到 toast 上,不用翻弹窗
        var first = (res.log || []).filter(function (l) { return /错误|失败|error/i.test(l); })[0];
        toast("✗ 推送失败:" + (first || "查看弹窗日志").slice(0, 60));
      }
    }).catch(function (e) {
      $("push-log").textContent = "请求失败:" + e.message;
      toast("✗ 推送失败:" + e.message);
    }).finally(function () { btn.disabled = false; });
  });

  // ---------- 搜索 / 视图切换 / 批量移动 / Git 状态 ----------
  $("searchBox").addEventListener("input", function () {
    state.query = this.value;
    render();
  });

  $("viewToggle").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-v]");
    if (!b) return;
    state.view = b.dataset.v;
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) {
      x.classList.toggle("on", x === b);
    });
    render();
  });

  $("selMove").addEventListener("change", function () {
    var target = this.value;
    this.value = "";
    if (!target) return;
    var ids = Array.from(state.selected);
    if (!ids.length) return;
    move(ids, target);
  });

  $("gitChip").addEventListener("click", function () {
    $("push-log").textContent = "尚未执行";
    $("maskPush").classList.add("show");
  });

  $("refresh").addEventListener("click", load);
  $("selAll").addEventListener("click", function () {
    // 只选当前可见(搜索过滤后的)那些,符合「全选我看到的」直觉
    var items = photosOf(state.current);
    var q = state.query.trim().toLowerCase();
    if (q) {
      items = items.filter(function (p) {
        return [p.title, p.id, p.filename].some(function (v) {
          return String(v || "").toLowerCase().indexOf(q) >= 0;
        });
      });
    }
    state.selected = new Set(items.map(function (p) { return p.id; }));
    render();
  });
  $("selClear").addEventListener("click", function () { state.selected.clear(); render(); });

  load();
})();
</script>
</body>
</html>
